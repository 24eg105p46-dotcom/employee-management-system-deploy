spring.application.name=employee-management-system

# Hosting platforms (Render, Railway...) provide the port in PORT
server.port=${PORT:8080}

# ---- MySQL ----
# Locally these defaults are used. On a server, set DB_URL, DB_USERNAME, DB_PASSWORD as environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:pranav}
spring.datasource.password=${DB_PASSWORD:123456}

# ---- JPA / Hibernate: tables are created and updated automatically ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Friendlier JSON
spring.jackson.default-property-inclusion=non_null

# Keep memory use low on small free servers
server.tomcat.threads.max=20
spring.datasource.hikari.maximum-pool-size=5
